spring.application.name=FoodRescuePlatform

# Render dynamically sets PORT; defaults to 8080 for local development
server.port=${PORT:8080}

# Production database credentials via environment variables (with localhost fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodrescue_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In production, Hibernate automatically creates/updates missing tables
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Production JWT secret & expiration via environment variables (with safe local fallback)
jwt.secret=${JWT_SECRET:FoodRescuePlatformSecretKeyForJWTAuthentication12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG